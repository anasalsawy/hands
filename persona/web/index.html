<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sawii Persona</title>
<style>
:root{--bg:#f6f4ef;--panel:#fffdf8;--ink:#1d1b16;--muted:#6f6a5e;--line:#e4dfd3;--accent:#c2562b;--me:#efe7d6;--them:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#15130f;--panel:#1d1a15;--ink:#eee8db;--muted:#9a9384;--line:#2e2a22;--accent:#e07a4c;--me:#2a251c;--them:#1f1c17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:2}
#mood{width:18px;height:18px;border-radius:50%;background:#eee;border:1px solid var(--line);flex:none}
#name{font-weight:650}#moodw{color:var(--muted);font-size:13px}
#clock{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right}
main{display:grid;grid-template-columns:1fr 320px;gap:0;height:calc(100vh - 57px)}
@media (max-width:820px){main{grid-template-columns:1fr}aside{display:none}aside.open{display:block;position:fixed;inset:57px 0 0 0;z-index:3}}
#chat{display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.b{max-width:78%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:var(--me)}.them{align-self:flex-start;background:var(--them);border:1px solid var(--line)}
.first{border-left:3px solid var(--accent)}.meta{font-size:11px;color:var(--muted);margin-top:2px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--panel)}
input,textarea,select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--accent);color:#fff;cursor:pointer;flex:none}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.live{background:#b3261e;animation:p 1.2s infinite}@keyframes p{50%{opacity:.6}}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:14px}
aside h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.mem{font-size:13px;border-bottom:1px solid var(--line);padding:6px 0}.mem q{color:var(--muted)}
.mem button{padding:2px 8px;font-size:11px;float:right}
#strip{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line)}#strip span{flex:1}
#toast{position:fixed;right:16px;bottom:84px;max-width:320px;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:none;z-index:5;box-shadow:0 6px 24px #0003}
#gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9}
#gate div{width:min(420px,92vw);display:flex;flex-direction:column;gap:10px}
small{color:var(--muted)}
</style>
</head>
<body>
<div id="gate"><div>
  <h2 style="margin:0">Sawii Persona</h2>
  <small>Paste your persona key. The key is the persona: same key on any device, same being.</small>
  <input id="key" placeholder="sp_..." autocomplete="off">
  <button id="enter">Enter</button>
</div></div>
<header>
  <div id="mood" title="how it feels"></div>
  <div><div id="name">…</div><div id="moodw"></div></div>
  <div id="clock"></div>
  <button class="ghost" id="side">☰</button>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="f"><input id="msg" placeholder="Say something…" autocomplete="off"><button id="mic" type="button" class="ghost" title="Talk (realtime voice)">🎙</button><button>Send</button></form>
  </section>
  <aside id="aside">
    <h3>Who they are</h3>
    <select id="preset"><option value="">— choose a preset —</option></select>
    <details style="margin-top:8px"><summary><small>…or clone someone you love</small></summary>
      <div style="display:flex;flex-direction:column;gap:6px;margin-top:6px">
        <input id="cname" placeholder="Their name"><input id="crel" placeholder="Who they are to you (e.g. my grandfather)">
        <textarea id="ctalk" rows="2" placeholder="How they talk"></textarea>
        <textarea id="csamples" rows="4" placeholder="Things they actually said - one per line"></textarea>
        <textarea id="cmem" rows="2" placeholder="Memories you share"></textarea>
      </div></details>
    <input id="uname" placeholder="Your name" style="margin-top:8px"><input id="tz" placeholder="Timezone e.g. Africa/Cairo" style="margin-top:6px">
    <button id="save" style="margin-top:8px;width:100%">Save persona</button>
    <h3>Feeling over time</h3><div id="strip"></div>
    <h3>Open loops</h3><div id="loops"><small>none</small></div>
    <h3>What it remembers <small>(you can wipe anything)</small></h3><div id="mem"></div>
  </aside>
</main>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let KEY=""; try{KEY=localStorage.getItem("sawii_key")||""}catch(e){}
const H=()=>({"Authorization":"Bearer "+KEY,"Content-Type":"application/json"});
let lastReplyAt=0, requestStart=0, ws=null, rec=null, speaking=false, playing=null, speechEpoch=0, speechInterrupted=false;

function fmt(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+"h ":"")+String(m).padStart(h?2:1,"0")+"m "+String(x).padStart(2,"0")+"s"}
setInterval(()=>{const now=Date.now()/1000;let t=lastReplyAt?"since last reply "+fmt(now-lastReplyAt):"first meeting";if(requestStart)t+=" · thinking "+(now-requestStart).toFixed(1)+"s";$("#clock").textContent=t},250);

function bubble(text,who,cls=""){const d=document.createElement("div");d.className="b "+who+" "+cls;d.textContent=text;$("#log").appendChild(d);$("#log").scrollTop=1e9;return d}
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",9000)}

async function api(path,opt={}){const r=await fetch(path,{...opt,headers:H()});if(r.status==401){KEY="";try{localStorage.removeItem("sawii_key")}catch(e){};$("#gate").style.display="";$("#key").value="";toast("That key didn't work. Paste a valid persona key.");throw new Error("401")}return r.json()}

async function enter(){
  const p=await api("/v1/persona");$("#gate").style.display="none";
  $("#name").textContent=p.name||"(unnamed persona)";$("#uname").value=p.user_name||"";$("#tz").value=p.timezone||"";
  const pr=await (await fetch("/v1/persona/presets")).json();
  for(const x of pr.presets){const o=document.createElement("option");o.value=x.id;o.textContent=x.title;if(x.id==p.preset)o.selected=true;$("#preset").appendChild(o)}
  const c=await api("/v1/persona/clock");if(c.since_your_last_reply_seconds!=null)lastReplyAt=Date.now()/1000-c.since_your_last_reply_seconds;
  refresh();listen();
}
$("#enter").onclick=()=>{const k=$("#key").value.trim();if(!k)return;KEY=k;try{localStorage.setItem("sawii_key",KEY)}catch(e){};enter().catch(e=>{})};
if(KEY)enter().catch(e=>{});

async function refresh(){
  const e=await api("/v1/persona/emotion");$("#mood").style.background=e.persona.color;$("#moodw").textContent="feels "+e.persona.words+" · you seem "+e.user.words;
  $("#strip").innerHTML=e.timeline.slice(-60).map(t=>`<span title="${t.words}" style="background:${t.color}"></span>`).join("")||"<small>&nbsp;no feelings recorded yet</small>";
  const l=await api("/v1/persona/loops");$("#loops").innerHTML=l.open.length?l.open.map(x=>`<div class="mem">#${x.id} ${esc(x.text)}${x.due_at?" <small>· "+new Date(x.due_at*1000).toLocaleString()+"</small>":""}</div>`).join(""):"<small>none</small>";
  const m=await api("/v1/persona/memory");$("#mem").innerHTML=m.layers.filter(x=>x.status=="active").slice(0,60).map(x=>`<div class="mem"><button class="ghost" onclick="wipe(${x.id})">wipe</button><b>${x.layer}·${x.author}</b> ${esc(x.text)}${x.quote?` <q>${esc(x.quote)}</q>`:""}</div>`).join("")||"<small>nothing yet</small>";
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
async function wipe(id){await api("/v1/persona/memory/"+id,{method:"DELETE"});refresh()}

function listen(){
  const es=new EventSource("/v1/events?key="+encodeURIComponent(KEY));
  es.addEventListener("clock",ev=>{const c=JSON.parse(ev.data);if(c.since_your_last_reply_seconds!=null&&!requestStart)lastReplyAt=Date.now()/1000-c.since_your_last_reply_seconds});
  es.addEventListener("message",ev=>{const m=JSON.parse(ev.data);bubble(m.text,"them","first");toast(m.text);lastReplyAt=Date.now()/1000;if(window.Notification&&Notification.permission=="granted")new Notification($("#name").textContent,{body:m.text})});
  es.addEventListener("memory_updated",()=>refresh());
  if(window.Notification&&Notification.permission=="default")Notification.requestPermission();
}

$("#f").onsubmit=async ev=>{ev.preventDefault();const t=$("#msg").value.trim();if(!t)return;$("#msg").value="";bubble(t,"me");
  if(ws&&ws.readyState==1){ws.send(JSON.stringify({type:"text",text:t}));return}
  const d=bubble("","them");requestStart=Date.now()/1000;
  const r=await fetch("/v1/chat/completions",{method:"POST",headers:H(),body:JSON.stringify({stream:true,messages:[{role:"user",content:t}]})});
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
  for(;;){const {value,done}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
    while((i=buf.indexOf("\n\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+2);if(!line.startsWith("data:"))continue;const p=line.slice(5).trim();if(p=="[DONE]")continue;
      try{const j=JSON.parse(p);const c=j.choices[0].delta.content;if(c){d.textContent+=c;$("#log").scrollTop=1e9}if(j.sawii_verdict){const m=document.createElement("div");m.className="meta";m.textContent="verified: "+j.sawii_verdict.level;d.appendChild(m)}}catch(e){}}}
  requestStart=0;lastReplyAt=Date.now()/1000;setTimeout(refresh,4000)};

$("#save").onclick=async()=>{const body={user_name:$("#uname").value,timezone:$("#tz").value||"UTC"};
  if($("#cname").value.trim()){body.clone={name:$("#cname").value,relationship:$("#crel").value,how_they_talk:$("#ctalk").value,sample_messages:$("#csamples").value,shared_memories:$("#cmem").value};body.name=$("#cname").value}
  else if($("#preset").value){body.preset=$("#preset").value}
  const p=await api("/v1/persona",{method:"PUT",body:JSON.stringify(body)});$("#name").textContent=p.name||"(unnamed persona)";toast("Saved.")};
$("#side").onclick=()=>$("#aside").classList.toggle("open");

// ---------------- realtime voice ----------------
function stopSpeech(){speechEpoch++;speechInterrupted=true;speaking=false;pendingAudioMeta=null;try{speechSynthesis.cancel()}catch(e){};if(playing){playing.pause();playing.src="";playing=null}}
function playOneAudio(blob,seq){
  if(playing||speechInterrupted)return; // no FIFO, never accumulate future speech
  const epoch=speechEpoch, url=URL.createObjectURL(blob), audio=new Audio(url);playing=audio;
  audio.onended=()=>{URL.revokeObjectURL(url);if(playing===audio)playing=null;
    if(epoch===speechEpoch&&!speechInterrupted){speaking=false;ws&&ws.send(JSON.stringify({type:"playback_done",seq}))}};
  audio.onerror=()=>{URL.revokeObjectURL(url);if(playing===audio)playing=null;
    if(epoch===speechEpoch&&!speechInterrupted){stopSpeech();ws&&ws.send(JSON.stringify({type:"interrupt"}))}};
  audio.play().catch(()=>audio.onerror&&audio.onerror());
}
let pendingAudioMeta=null, live=null;
$("#mic").onclick=()=>{if(ws){ws.close();ws=null;if(rec)rec.stop();$("#mic").classList.remove("live");return}
  ws=new WebSocket((location.protocol=="https:"?"wss://":"ws://")+location.host+"/v1/voice");ws.binaryType="blob";
  ws.onopen=()=>ws.send(JSON.stringify({type:"hello",key:KEY,playback_ack:true}));
  ws.onmessage=ev=>{if(typeof ev.data!=="string"){const meta=pendingAudioMeta;pendingAudioMeta=null;if(meta&&!speechInterrupted)playOneAudio(ev.data,meta.seq);return}
    const m=JSON.parse(ev.data);
    if(m.type=="ready"){$("#mic").classList.add("live");startRec()}
    else if(m.type=="delta"){if(!live){live=bubble("","them");requestStart=Date.now()/1000}live.textContent+=m.text}
    else if(m.type=="say"){if(!speechInterrupted){speaking=true;const epoch=speechEpoch;const u=new SpeechSynthesisUtterance(m.text);u.onend=()=>{if(epoch===speechEpoch&&!speechInterrupted){speaking=false;ws&&ws.send(JSON.stringify({type:"playback_done",seq:m.seq}))}};u.onerror=()=>{if(epoch===speechEpoch&&!speechInterrupted){stopSpeech();ws&&ws.send(JSON.stringify({type:"interrupt"}))}};speechSynthesis.speak(u)}}
    else if(m.type=="audio"){if(!speechInterrupted){speaking=true;pendingAudioMeta=m}}
    else if(m.type=="done"){speechInterrupted=false;live=null;requestStart=0;lastReplyAt=Date.now()/1000;setTimeout(refresh,4000)}
    else if(m.type=="steered"){speechInterrupted=false}
    else if(m.type=="message"){bubble(m.text,"them","first")}};
  ws.onclose=()=>{ws=null;$("#mic").classList.remove("live");if(rec)try{rec.stop()}catch(e){}}};
function startRec(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("This browser has no speech recognition - type, and it will still speak back.");return}
  rec=new SR();rec.continuous=true;rec.interimResults=true;rec.lang=navigator.language||"en-US";
  rec.onresult=e=>{const r=e.results[e.results.length-1];
    if(speaking||playing){stopSpeech();ws&&ws.send(JSON.stringify({type:"interrupt"}))} // barge-in
    if(r.isFinal){const t=r[0].transcript.trim();if(t&&ws){bubble(t,"me");ws.send(JSON.stringify({type:"text",text:t}))}}};
  rec.onend=()=>{if(ws)try{rec.start()}catch(e){}};rec.start()}
</script>
</body>
</html>
