name: release
on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "desktop/**"
      - "persona/**"
      - "engine/**"
      - "*.py"
      - "requirements.txt"
      - ".github/workflows/release.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the UI
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Package (portable + Windows bundle)
        run: |
          python packaging/package.py portable
          python packaging/package.py windows
      - uses: actions/upload-artifact@v4
        with:
          name: hands
          path: dist-release/*.zip
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Hands v0.2.${{ github.run_number }}
          files: dist-release/*.zip
          generate_release_notes: true
