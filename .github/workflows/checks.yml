name: Hands checks and Windows build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            engine/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-test.txt
      - run: python -m pip install -r scripts/requirements-test.txt
      - run: npm ci --prefix engine
      - run: npm ci --prefix desktop
      - run: python scripts/speed_selftest.py
      - run: python scripts/tars_loop_selftest.py
      - run: python scripts/engine_no_llm_guard.py
      - run: python scripts/court_selftest.py
      - run: python scripts/court_http_selftest.py
      - run: python scripts/split_engines_selftest.py
      - run: python scripts/run_checks.py
      - run: npm test --prefix desktop
      - run: npm run typecheck --prefix desktop
      - run: npm run build --prefix desktop

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci --prefix desktop
      - run: npm run tauri:build --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Hands-Windows-installers
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
